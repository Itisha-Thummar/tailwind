<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
        src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp,container-queries"></script>
<style>
   *{
    margin: 0px;
    padding: 0px;
    font-family: consolas;
    box-sizing: border-box;
   }
   body{
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: black;
   
   }
   a{
    position: relative;
    display: inline-block;
    padding: 25px 30px;
    margin: 40px 0;
    transition: 0.5s;
    overflow: hidden;
    color: green;
    text-transform: uppercase;
    letter-spacing: 4px;
    -webkit-box-reflect:below 1px linear-gradient(transparent,#0005);
   }
   a:nth-child(2){
    filter: hue-rotate(180deg);
   }
   a:nth-child(3){
    filter: hue-rotate(80deg);
   }
   a:hover{
    background-color:green;
    color:black;
    box-shadow: 0 0 5px green,
                0 0 25px green,
                0 0 50px green,
                0 0 200px green;
   }
   a span{
    position: absolute;
    display: block;
   }
   a span:nth-child(1){
    top:0;
    left: -100%;
    width: 100%;
    height: 2px;
    background:linear-gradient(90deg,transparent, green);
    animation: animate1 1s linear infinite;
   }
   @keyframes animate1 {
    0%
    {
        left: -100%;
    }
    50%,100%{
        left:100%;
    }
   }


   a span:nth-child(2){
    top:-100%;
    right: 0;
    width: 2px;
    height: 100%;
    background:linear-gradient(180deg,transparent, green);
    animation: animate2 1s linear infinite;
    animation-delay: 0.25s;
   }
   @keyframes animate2 {
    0%
    {
        top: -100%;
    }
    50%,100%{
        top:100%;
    }
   }



   a span:nth-child(3){
    bottom:0;
    right: 100%;
    width: 100%;
    height: 2px;
    background:linear-gradient(270deg,transparent, green);
    animation: animate3 1s linear infinite;
    animation-delay: 0.25s;
   }
   @keyframes animate3 {
    0%
    {
        right: -100%;
    }
    50%,100%{
        right:100%;
    }
   }



   a span:nth-child(4){
    bottom:-100%;
    left: 0;
    width: 2px;
    height: 100%;
    background:linear-gradient(360deg,transparent, green);
    animation: animate4 1s linear infinite;
    animation-delay: 0.75s;
   }
   @keyframes animate4 {
    0%
    {
        bottom: -100%;
    }
    50%,100%{
        bottom:100%;
    }
   }
</style>
    </head>
<body>
<a href="" class="text-green-500">
   <span></span>
   <span></span>
   <span></span>
   <span></span>
   neno button
</a>
<a href="" class="text-green-500">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    neno button
 </a>
 <a href=""class="text-green-500">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    neno button
 </a>

  
</body>
</html>
