    @keyframes dot1 {
        0% {
            left: 30px;
            top: 75px;
            opacity: 1;
        }

        25% {
            left: 40px;
            top: 75px;
            opacity: 1;
        }

        50% {
            left: 50px;
            top: 75px;
            opacity: 0.7;
        }

        75% {

    @keyframes line1 {

        0%,
        20% {
            transform: scaleX(0);
        }

        40% {
            transform: scaleX(1);
            transform-origin: left;
        }

        40.000001%,
        60% {
            transform: scaleX(1);
            transform-origin: right;
        }

        80%,
        100% {
            transform: scaleX(0);
            transform-origin: right;
        }
    }

    @keyframes spin {
        from {
            rotate: 0deg;
        }

        to {
            rotate: 360deg;
        }
    }

    @keyframes line2 {
        100% {
            top: 70px;
            left: 55px;
