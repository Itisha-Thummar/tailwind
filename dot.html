<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
        src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp,container-queries"></script>
<style>
    .loading::before {
        content: "";
        width: 160px;
        height: 60px;
        background: #ffffff33;
        border: 2px solid #ffffff9c;
        position: absolute;
        border-bottom-left-radius:  10px;
        border-bottom-right-radius:  10px;
        border-top: none;
        animation: blur-box_div 2s linear infinite;
        backdrop-filter: blur(6px);
    }

    .loading div {
        border-radius: 50%;
        width: 30px;
        height: 30px;
        z-index: -1;
        animation: all-dots 2s linear infinite;
        margin: 0.2em;
    }
    .loading div:nth-child(1) {
        background: #cbcaca;
    }
    .loading div:nth-child(2) {
        background: #c3e908;
        animation-delay: 0.20s;
    }

    .loading div:nth-child(3) {
        background: #f10d49;
        animation-delay: 0.45s;
    }

    .loading div:nth-child(4) {
        background: #795dcf;
        animation-delay: 0.65s;
    }
    @keyframes all-dots {

        0% {
            transform: translateY(0px);
        }

        50% {
            transform: translateY(-83px);
        }
    }

    @keyframes blur-box_div {

        0%
        {
            transform: rotate(-11deg);
        }

        50%{
            transform: rotate(11deg);
        }

        100%
        {
            transform: rotate(-11deg);
        }
    }
</style>
    </head>
<body class="bg-black h-screen flex justify-center items-center">
  
    <div class="loading relative flex justify-center items-center "  >
        <div class="div1 "></div>
        <div class="div2"></div>
        <div class="div3"></div>
        <div class="div4"></div>
      </div> 
   
</body>
</html>
